# vhost, который РЕАЛЬНО отдаёт avavpn.ru по HTTPS.
#
# Порт 443 на main занят xray (inbound reality-443). Клиент с Reality-ключом
# уходит в туннель, обычный браузер проваливается в fallback сюда, на
# 127.0.0.1:8443. Наружу этот порт не слушает — только через xray.
# Поэтому НЕ добавляйте сюда `listen 443` : конфликт с xray уронит VPN-узел.
#
# Установка (server-deploy.sh делает это сам):
#   sudo cp deploy/nginx-reality-fallback.conf /etc/nginx/sites-available/reality-fallback
#   sudo ln -sf /etc/nginx/sites-available/reality-fallback /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name avavpn.ru www.avavpn.ru;

    ssl_certificate     /etc/letsencrypt/live/avavpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avavpn.ru/privkey.pem;
    # TLS-профиль certbot: отключает TLS 1.0/1.1 и слабые шифры.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/testv/public;
    index index.php;

    charset utf-8;

    # Раньше эти заголовки стояли только в :80-vhost'е, то есть на HTTPS —
    # на единственном пути, которым реально ходят люди — их не было вовсе.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Без includeSubDomains и preload сознательно: cdn.avavpn.ru обслуживается
    # Yandex Cloud CDN, его TLS мы не контролируем, а preload — билет в один конец.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }
    location = /sitemap.xml { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Большие заголовки от Laravel (Set-Cookie) и длинные строки в ответе
        # /sub/{token} — без этого nginx пишет «upstream sent too big header»
        # и клиент получает 502. В :80-vhost'е буферы были, здесь их не было.
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
