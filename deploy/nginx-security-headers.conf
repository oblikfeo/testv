# Заголовки безопасности для vhost'а, который реально отдаёт сайт по HTTPS —
# reality-fallback (nginx 127.0.0.1:8443, TLS-серт avavpn.ru, root /var/www/testv/public).
#
# Подключение (разовая ручная правка на сервере, server-deploy.sh это не трогает,
# чтобы случайно не сломать fallback для xray Reality):
#
#   sudo nano /etc/nginx/sites-available/reality-fallback
#   # внутрь блока server { ... }, рядом с ssl_certificate:
#   include /var/www/testv/deploy/nginx-security-headers.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Осторожно с наследованием: если в этом же server-блоке какой-нибудь location
# имеет собственный add_header, nginx перестаёт наследовать заголовки уровня
# server ИМЕННО в этом location — тогда include нужно продублировать внутрь него.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS. Без includeSubDomains и preload сознательно: cdn.avavpn.ru обслуживается
# Yandex Cloud CDN, его TLS мы не контролируем, а preload — это билет в один конец.
add_header Strict-Transport-Security "max-age=31536000" always;
