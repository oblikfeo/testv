# vhost :80 для main (195.133.198.70) — ТОЛЬКО редирект на HTTPS.
#
# Почему тут нет самого сайта:
#   Порт 443 на main занят xray (inbound reality-443). Реальные браузеры без
#   Reality-ключа проваливаются в fallback на nginx 127.0.0.1:8443 (vhost
#   reality-fallback, TLS-сертификат avavpn.ru) — именно он отдаёт Laravel.
#   Наружу nginx смотрит только этим :80, и раньше он отдавал сайт открытым
#   текстом: сессионная кука Laravel уходила без флага secure и перехватывалась.
#
# Установка:
#   sudo cp deploy/nginx-site-ip.conf /etc/nginx/sites-available/testv
#   sudo ln -sf /etc/nginx/sites-available/testv /etc/nginx/sites-enabled/testv
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# (server-deploy.sh делает это сам на каждом деплое.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name avavpn.ru www.avavpn.ru 195.133.198.70 _;

    charset utf-8;

    # Продление сертификата Let's Encrypt (HTTP-01) обязано остаться на :80:
    # :443 занят xray, а nginx:8443 наружу не слушает — если увести challenge
    # в редирект, certbot renew перестанет проходить и сайт останется без TLS.
    # Пробуем оба вероятных webroot'а (дефолтный certbot и public/ приложения);
    # плагин --nginx подставляет свой exact-match location и работает независимо.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri @acme_app_root;
    }

    location @acme_app_root {
        default_type "text/plain";
        root /var/www/testv/public;
        try_files $uri =404;
    }

    # 308, а не 301: сохраняет метод и тело запроса. Если какой-то вебхук
    # (ЮKassa) или клиент подписки ещё ходит на http://, POST доедет POST-ом,
    # а не выродится в GET с потерянным телом.
    location / {
        return 308 https://avavpn.ru$request_uri;
    }
}
